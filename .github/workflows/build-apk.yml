name: Build Android APK

# Ye workflow tab chalega jab bhi:
#   1. 'main' branch pe naya code push ho, YA
#   2. Aap ise manually "Run workflow" button se GitHub Actions tab mein chala do
on:
  push:
    branches:
      - main
  workflow_dispatch:   # manual "Run workflow" button ke liye

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1) Repo ka code checkout karo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Java/JDK setup (Android Gradle builds ke liye zaroori hai)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3) Gradle ko cache karo taaki agli baar build fast ho
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 4) gradlew ko executable permission do (Linux runner pe zaroori hai)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5) Debug APK build karo (koi signing key ki zarurat nahi, seedha install ho sakti hai)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 6) Build hui APK ko workflow ke saath attach karo, taaki download ho sake
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
