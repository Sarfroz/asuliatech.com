name: Android CI / Build APK
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Verify Gradle Wrapper
        run: |
          pwd
          java -version
          ls -lh gradle/wrapper
          sha256sum gradle/wrapper/gradle-wrapper.jar
          file gradle/wrapper/gradle-wrapper.jar
          jar tf gradle/wrapper/gradle-wrapper.jar | head

      - name: Regenerate Gradle Wrapper if corrupt
        run: |
          if ! jar tf gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
            echo "gradle-wrapper.jar is corrupt or invalid — regenerating from official source"

            DIST_URL=$(grep 'distributionUrl' gradle/wrapper/gradle-wrapper.properties | cut -d'=' -f2- | sed 's/\\:/:/g')
            GRADLE_VERSION=$(echo "$DIST_URL" | grep -oP 'gradle-\K[0-9.]+(?=-(bin|all)\.zip)')
            echo "Detected Gradle version: $GRADLE_VERSION"

            TMP_DIR=$(mktemp -d)
            curl -L -o "$TMP_DIR/gradle.zip" "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            unzip -q "$TMP_DIR/gradle.zip" -d "$TMP_DIR"
            cp "$TMP_DIR/gradle-${GRADLE_VERSION}/lib/plugins/gradle-wrapper-main-${GRADLE_VERSION}.jar" gradle/wrapper/gradle-wrapper.jar 2>/dev/null || \
            find "$TMP_DIR/gradle-${GRADLE_VERSION}" -name "gradle-wrapper-*.jar" -exec cp {} gradle/wrapper/gradle-wrapper.jar \;

            echo "Regenerated. Verifying..."
            file gradle/wrapper/gradle-wrapper.jar
            jar tf gradle/wrapper/gradle-wrapper.jar | head
          else
            echo "gradle-wrapper.jar is valid — no action needed"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
